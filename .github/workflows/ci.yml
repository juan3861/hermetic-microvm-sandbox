name: Hyperion CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Bubblewrap & Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap gcc libc6-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Core Quantum Math & Cartography Tests
      run: |
        python -m pytest tests/test_agi_autonomous_cortex.py -v -s
