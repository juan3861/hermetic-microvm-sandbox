name: Hyperion CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Bubblewrap & Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap gcc libc6-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Compile Silicon Core Hardware C Binaries
      run: |
        gcc -O3 silicon_core/hyperion_silicon_launcher.c -o silicon_core/hyperion_silicon_launcher || true
        gcc -O3 silicon_core/hyperion_mmu_cow_forker.c -o silicon_core/hyperion_mmu_cow_forker || true
        chmod +x silicon_core/hyperion_silicon_launcher || true
        chmod +x silicon_core/hyperion_mmu_cow_forker || true

    - name: Test CLI Entrypoints & Capabilities
      run: |
        python orchestrator.py --help
        python orchestrator.py dashboard
        python orchestrator.py repl --code "1 + 1"
        python orchestrator.py pool --action status
        python orchestrator.py egress --target 169.254.169.254
        python orchestrator.py metrics --format prometheus
        python orchestrator.py sanitize --text "My secret sk-12345678901234567890"
        python orchestrator.py pty --cmd "echo 'CI_PTY_OK'"
        python orchestrator.py replay
        python orchestrator.py gpu --action probe
        python orchestrator.py fuzz
        python orchestrator.py mesh --action status

    - name: Execute Full 23 Master Test Suites
      run: |
        set -e
        for test_file in tests/test_*.py; do
          echo "=========================================================="
          echo "Running $test_file"
          echo "=========================================================="
          python "$test_file"
        done
