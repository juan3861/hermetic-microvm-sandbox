[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermetic-microvm-sandbox"
version = "2.0.0"
authors = [
  { name="Ruan Novaes", email="ruan@aethermind.ai" },
]
description = "The Ultra-Fast Hermetic MicroVM & Silicon Sandbox for AI Agents — Dual-Engine (Cloud-Cascade + Kernel RAM-Disk) with Seccomp-BPF, MMU CoW, OCI Spec, and Formal SMT Proofs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Security",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "z3-solver>=4.12.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "libcst>=1.0.0",
    "bandit>=1.7.5",
    "radon>=6.0.1",
    "vulture>=2.7"
]

[project.urls]
"Homepage" = "https://github.com/juan3861/hermetic-microvm-sandbox"
"Bug Tracker" = "https://github.com/juan3861/hermetic-microvm-sandbox/issues"

[project.scripts]
hermetic = "orchestrator:main"
hyperion = "orchestrator:main"
